name: CI

# Repo B (the Flutter merchant admin app) had NO CI of any kind. 79 guard tests
# existed and nothing ran them, which made them documentation rather than
# guards: the suite could go red for weeks without anyone learning. This file
# is the first pipeline for this repository.
#
# WHAT IS GATED, AND WHY EACH BAR IS WHERE IT IS
#
#   pubspec.lock is installable    -- blocking. NEW, and the one that makes
#                                     every number below mean something.
#   flutter test                   -- blocking, must be 100%. MEASURED 1158/1158.
#   flutter analyze errors         -- blocking, must be 0. MEASURED 0.
#   flutter analyze warnings       -- blocking, must be 0. MEASURED 0.
#   flutter analyze infos          -- RATCHET at 248: may fall, never rise.
#   signing material in git        -- blocking.
#   analyzer suppression count     -- RATCHET at 43: may fall, never rise.
#   tracked files the build may rewrite -- blocking, allowlist of exactly one.
#
# The warnings bar is deliberately set to ZERO rather than to
# `--no-fatal-warnings`. The instruction for this work was not to make the
# board green by lowering a bar, so the 54 warnings that existed were fixed
# first -- four of them were real product defects, not tidiness -- and only
# then was the gate set above them. `flutter analyze --no-fatal-infos` was
# verified to exit 1 when a single unused local is introduced and 0 when it is
# removed, so this gate is known to bite rather than assumed to.
#
# The infos bar is a ratchet rather than zero because the remaining issues are
# all informational. It was 552; the 304 deprecated `withOpacity` calls that
# made up the majority have since been migrated to `withValues`, measured
# 552 -> 248 with 0 errors and 0 warnings throughout, so the ceiling moves
# with them -- lowering it in the same commit as the fix is what keeps a
# ratchet a ratchet. What is left is 93 prefer_const_constructors, 91
# unnecessary_this, 23 remaining deprecations (activeColor, trackColor,
# MaterialStateProperty and friends, each needing a judgement call rather than
# a substitution), 12 use_super_parameters and a tail of smaller lints. Same
# idiom, and same reasoning, as the composer-audit ratchet in repo A's ci.yml.
#
# ACTION PINNING. All three `uses:` lines name an immutable commit SHA, with
# the tag they resolved from in a trailing comment. A version tag is mutable:
# whoever controls the action repository can move `v4.2.2` to a different
# commit, and every run after that executes code nobody here reviewed, with
# this repository's checkout and the Flutter cache in reach.
#
# The previous revision left tags in place for an honest reason -- the GitHub
# API was unreachable, and an unverifiable 40-character hex string is worse
# than a tag. That is now resolved and VERIFIED rather than copied:
#
#   actions/checkout v4.2.2
#     git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
#       -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   subosito/flutter-action v2.18.0
#     git ls-remote https://github.com/subosito/flutter-action refs/tags/v2.18.0
#       -> f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
#
# Neither printed a peeled `^{}` line, so both tags are lightweight and point
# straight at a commit. Each SHA was then fetched (`git fetch --depth 1 <url>
# <sha>`) and the object confirmed to BE a commit in that repository:
# "Prepare 4.2.2 Release (#1953)" dated 2024-10-23 and "fix syntax mistake in
# readme (#338)" dated 2024-12-03. The github.com release page for each tag
# shows the same SHA, so two independent routes agree.
#
# The GitHub REST API is still unreachable from here (api.github.com answers
# 403 through this environment's proxy, and the gh CLI and the GitHub MCP tool
# both refuse repositories outside this workspace). git-over-HTTPS is not, and
# it is the authoritative source for a ref anyway.
#
# To move an action version: resolve the new tag the same way, replace the SHA,
# and update the trailing comment in the same edit.
#
# NOT GATED, DELIBERATELY
#
#   Nothing about pubspec.lock. It is GATED now -- see below -- so it has
#   moved out of this list.
#
# THE LOCKFILE, WHICH USED TO BE THE BIGGEST HOLE HERE
#
#   This section previously explained, at length, that the committed
#   pubspec.lock could not be installed on this toolchain:
#
#     $ flutter pub get --enforce-lockfile
#     > vector_math 2.4.3 (was 2.2.0)
#     Would change 7 dependencies.
#     Unable to satisfy `pubspec.yaml` using `pubspec.lock`.
#     Failed to update packages.
#
#   That was true, and it meant every figure this project reported for repo B
#   came from a RE-RESOLVED package set that nobody had committed. The job
#   below ran `flutter pub get`, which silently re-resolved on each run, so
#   the pipeline could not have caught it either.
#
#   IT IS FIXED, by committing the resolution instead of re-doing it. The
#   seven packages the lock was behind on, and why each moved -- read from the
#   SDK's own manifests rather than inferred:
#
#     characters               1.4.0   -> 1.4.1   flutter/pubspec.yaml:15 ^1.4.1
#     material_color_utilities 0.11.1  -> 0.13.0  flutter/pubspec.yaml:19 EXACT 0.13.0
#     meta                     1.16.0  -> 1.19.0  flutter/pubspec.yaml:20 ^1.18.3
#     vector_math              2.2.0   -> 2.4.3   flutter/pubspec.yaml:21 ^2.4.0
#     test_api                 0.7.6   -> 0.7.12  flutter_test/pubspec.yaml:21 EXACT 0.7.12
#     matcher                  0.12.17 -> 0.12.20 flutter_test/pubspec.yaml:22 EXACT 0.12.20
#     intl                     0.20.2  -> 0.20.3  pub.dev, inside the declared ^0.20.2
#
#   SIX OF THE SEVEN ARE NOT A CHOICE. They are what the Flutter SDK pinned to
#   FLUTTER_VERSION below requires of its own dependencies, three of them as
#   exact pins. So the committed lock was not merely stale, it was
#   categorically uninstallable at this Flutter version, and no `pub get` on
#   this SDK could ever have produced it. `intl` is the only genuine pub.dev
#   resolution, and it is a patch bump inside the constraint pubspec.yaml
#   already declares.
#
#   VERSION CROSSINGS, stated precisely because "nothing crosses a major" is
#   the kind of claim that hides the one case that matters. Under plain semver
#   nothing crosses a major version. Under pub's rule for 0.x releases, where
#   the MINOR is the breaking component, exactly one does:
#   material_color_utilities 0.11.1 -> 0.13.0 (^0.11.1 would not admit 0.13.0).
#   It is transitive, it is an EXACT pin in flutter/pubspec.yaml, and it is
#   therefore not a decision this repository gets to make.
#
#   pubspec.yaml's `environment:` was raised in the same commit, because the
#   two files disagreed about the minimum toolchain and the lock is the one
#   that binds: `--enforce-lockfile` checks the lock's `sdks:` block and
#   refuses below it, so a developer on an older Dart passed the manifest's
#   check and then failed the lock's. Both floors are copied from the lock's
#   own `sdks:` block rather than chosen:
#
#     sdk:     '>=3.1.3 <4.0.0'  ->  '>=3.11.0 <4.0.0'
#     flutter: (absent)          ->  '>=3.35.1'
#
#   MEASURED AFTERWARDS, all four on this worktree:
#     flutter pub get --enforce-lockfile  -> "Got dependencies!", exit 0
#     flutter pub get, run twice          -> pubspec.lock byte-identical
#     flutter analyze                     -> 248 issues, 0 errors, 0 warnings
#     flutter test                        -> 1158/1158
#   and the lock is still byte-identical after analyze and test, which is why
#   the containment step below can now allow exactly ONE file to change.
#
#   NOT VERIFIED HERE, and said plainly: none of this has run on a GitHub
#   ubuntu-24.04 runner. If the install step below fails there, that is the
#   gate working -- it means the committed resolution does not reproduce on a
#   clean machine, which is exactly what repo A's lock job discovered about
#   PayHere the first time it was allowed to run.
#
#   analysis_options.yaml cleanliness. `flutter analyze` REWRITES this file:
#   the SDK's own AnalysisOptionsMigration adds an `analyzer: exclude:` block
#   for the generated platform directories (flutter_tools/lib/src/migrations/
#   analysis_options_migration.dart:14-77, which logs "Upgrading
#   analysis_options.yaml to exclude build and platform directories"). It is
#   the tool, not a developer hiding scope. It also hides nothing here: the
#   project reports 248 issues both with and without that block, because
#   android/, ios/, web/, windows/, macos/ and linux/ contain no Dart in this
#   repository. check-no-new-suppressions.sh therefore reads the COMMITTED
#   file rather than the working tree, and separately fails any exclude that
#   reaches lib/.
#
#   MEASURED ADDITION: `flutter test` rewrites this file too, not only
#   `flutter analyze` -- it prints the same "Upgrading analysis_options.yaml to
#   exclude build and platform directories" line. So BOTH slow steps below
#   leave the tree dirty, and any step added after them that asserted a clean
#   tree would fail for a reason unrelated to the code. Rather than leaving
#   that as a comment, the last step of the job now states exactly which paths
#   the SDK is allowed to have touched, fails on any other, and restores them.
#   That is the difference between a known mutation and an ignored one.
#
#   A signed release artifact. android/app/build.gradle.kts aborts a release
#   build when android/key.properties is missing, by design, and no runner has
#   the keystore. The authoritative check is
#     apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk
#   whose certificate subject must not be `CN=Android Debug, O=Android, C=US`.
#   That needs real signing material and so cannot live here; what CAN be
#   checked without it is in test/security/release_signing_test.dart (9 tests,
#   run by `flutter test` below) plus the git-level hygiene job.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version this repository is developed and measured against.
  # A floating 'stable' would silently change the analyzer's diagnostic set,
  # which is exactly what both ratchets below are counting.
  FLUTTER_VERSION: 3.47.7

jobs:
  # ---------------------------------------------------------------------------
  # Needs no Flutter SDK, so it answers in seconds and runs in parallel with
  # the slow job. Both checks are pure git plus shell.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Secrets and suppression hygiene
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: a keystore that was committed once and deleted later
          # is still in the pack and still compromised, and
          # check-signing-material.sh looks for exactly that.
          fetch-depth: 0

      - name: No signing material is tracked by git
        # Asserts the material is IGNORED, never that it is absent.
        # android/key.properties legitimately exists on a release engineer's
        # machine (android/RELEASE_SIGNING.md:47), so an absence check would
        # fail the moment the owner follows the documented runbook.
        run: ./.github/scripts/check-signing-material.sh

      - name: No new analyzer suppressions
        run: ./.github/scripts/check-no-new-suppressions.sh

  # ---------------------------------------------------------------------------
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record the toolchain actually used
        # The ratchets are only meaningful against a known analyzer, so the
        # version goes in the log where a failure can be read against it.
        run: flutter --version

      - name: The committed pubspec.lock is installable, and is what is used
        # --enforce-lockfile rather than a bare `pub get`. A bare `pub get`
        # re-resolves and REWRITES the lock, so every step after it measured a
        # package set that was never committed and the drift could not fail a
        # build. With this flag the job installs the committed resolution or
        # stops, which is what makes the numbers in the steps below
        # reproducible rather than merely reported.
        #
        # It also means pubspec.lock is no longer rewritten during the run --
        # measured: byte-identical after analyze and test -- which is what
        # lets the containment step at the end allow only one file.
        run: flutter pub get --enforce-lockfile

      - name: No errors and no warnings
        # --no-fatal-infos keeps the 248 informational issues out of the
        # verdict while leaving errors AND warnings fatal. Verified to exit
        # non-zero on a single injected unused local.
        run: flutter analyze --no-fatal-infos

      - name: Informational issues must not grow
        # The ratchet that makes the step above safe to keep narrow. The count
        # may fall and never rise, so new informational debt fails the build
        # even while the known 248 are being paid down.
        env:
          INFO_CEILING: '248'
        run: |
          set -o pipefail

          # OUTSIDE the repository. Writing analyze.txt into the checkout left
          # an untracked file behind, which the containment step at the end of
          # this job correctly reports as "the build modified something it was
          # not supposed to" -- found by running that step locally rather than
          # by watching a red build.
          out="$(mktemp -t analyze.XXXXXX)"

          flutter analyze > "$out" 2>&1 || true

          if grep -q 'No issues found' "$out"; then
            found=0
          else
            found="$(grep -c '^ *info • ' "$out" || true)"
          fi

          if [ -z "$found" ]; then
            echo "::error::Could not parse the analyzer output."
            cat "$out"
            exit 1
          fi

          # A total of 0 with a non-empty report means the format changed and
          # this step has gone vacuous, which must fail loudly rather than pass.
          total="$(sed -n 's/^\([0-9]\{1,\}\) issues\? found\..*/\1/p' "$out" | tail -1)"
          if [ -n "$total" ] && [ "$total" -gt 0 ] && [ "$found" -eq 0 ]; then
            echo "::error::Analyzer reported $total issues but none parsed as 'info'. The output format changed; fix this step."
            cat "$out"
            exit 1
          fi

          echo "informational issues: $found (ceiling $INFO_CEILING)"

          if [ "$found" -gt "$INFO_CEILING" ]; then
            echo "::error::Informational issue count rose from $INFO_CEILING to $found."
            cat "$out"
            exit 1
          fi

          if [ "$found" -lt "$INFO_CEILING" ]; then
            echo "::notice::Informational issues fell to $found. Lower INFO_CEILING to $found so the ratchet keeps holding."
          fi

      - name: flutter test
        # Must be 100%. There is no allowance here and no continue-on-error:
        # the suite measures 1158/1158 on this SDK (217 at the time this job
        # was written; the response-shape and release-posture work added 888,
        # the temp-directory race one more, and this closure cycle 52 -- the
        # 429 backoff 21, the newly-gated-endpoint contract 9, store-change
        # cache isolation 13, the TLS guard's own self-checks 4 and the
        # release-abort coverage 6), so a red run is a real regression rather
        # than inherited debt.
        #
        # EVERY ONE OF THOSE FIGURES WAS RE-MEASURED, not carried forward.
        # This file has twice shipped a stale count, which is why the number
        # is cited next to the step that enforces it rather than only in a
        # summary at the top.
        run: flutter test --reporter expanded

      # ---------------------------------------------------------------------
      # LAST step on purpose. Two steps above rewrite a TRACKED file:
      # `flutter analyze` and `flutter test` both add the SDK's
      # `analyzer: exclude:` block to analysis_options.yaml. Running this at
      # the end means it sees every mutation they made between them, names the
      # ONE that is expected, and fails on anything else -- a build that
      # quietly edits a source file is a build nobody can reproduce.
      #
      # pubspec.lock USED TO BE ON THIS ALLOWLIST, because `flutter pub get`
      # re-resolved it on every run. It is not any more: the install step uses
      # --enforce-lockfile, and the lock was measured byte-identical after
      # analyze and test. So a pubspec.lock that changes during a build now
      # means the committed resolution did not hold, and that must fail here
      # rather than be waved through as expected noise.
      #
      # It also restores the one file, so a step added after this can assert a
      # clean tree and have that assertion mean something.
      # ---------------------------------------------------------------------
      - name: The SDK's tracked-file rewrites are contained, not ignored
        run: |
          set -euo pipefail

          echo "Working tree after the build:"
          git status --porcelain

          # One pass, no word splitting: a path containing a space must not
          # be silently broken into two "unexpected" entries.
          unexpected="$(git status --porcelain |
            sed 's/^...//; s/.* -> //' |
            sort -u |
            grep -vxE 'analysis_options\.yaml' || true)"

          if [ -n "$unexpected" ]; then
            echo "::error::The build modified tracked files other than the one expected. Only analysis_options.yaml (the SDK's analyzer migration) may change. A pubspec.lock listed here means --enforce-lockfile did not hold the committed resolution: run 'flutter pub get' locally, check what moved, and commit the lock with its reason."
            printf '%s\n' "$unexpected"
            git --no-pager diff
            exit 1
          fi

          # The SDK's block excludes the generated platform directories. An
          # exclude reaching lib/ would silence the whole app and both
          # analyzer gates above with it, so it fails here too, not only in
          # check-no-new-suppressions.sh, which reads the committed file.
          if git diff -- analysis_options.yaml |
               grep -nE '^\+[[:space:]]*-[[:space:]]*(\./)?lib(/|$)'; then
            echo "::error::The analysis_options rewrite excluded lib/ from analysis."
            exit 1
          fi

          git checkout -- analysis_options.yaml

          echo "Restored. Working tree now:"
          git status --porcelain
