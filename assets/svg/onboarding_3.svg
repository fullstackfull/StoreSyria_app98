<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chart Background -->
  <rect x="50" y="60" width="200" height="180" rx="10" fill="white" fill-opacity="0.9"/>
  
  <!-- Chart Bars -->
  <rect x="70" y="180" width="30" height="40" rx="3" fill="#00B4D8" fill-opacity="0.4"/>
  <rect x="110" y="150" width="30" height="70" rx="3" fill="#00B4D8" fill-opacity="0.6"/>
  <rect x="150" y="120" width="30" height="100" rx="3" fill="#00B4D8" fill-opacity="0.8"/>
  <rect x="190" y="90" width="30" height="130" rx="3" fill="#00B4D8"/>
  
  <!-- Growth Arrow -->
  <path d="M70 190 L100 160 L130 140 L160 100 L190 70" stroke="white" stroke-width="4" fill="none"/>
  <polygon points="185,60 195,70 180,75" fill="white"/>
  
  <!-- Trend Up Icon -->
  <circle cx="220" cy="80" r="30" fill="white" fill-opacity="0.9"/>
  <path d="M205 85 L215 75 L225 85" stroke="#00B4D8" stroke-width="3" fill="none"/>
  <line x1="215" y1="75" x2="215" y2="95" stroke="#00B4D8" stroke-width="3"/>
  
  <!-- Currency/Money Icon -->
  <circle cx="60" cy="220" r="20" fill="white" fill-opacity="0.9"/>
  <text x="60" y="226" text-anchor="middle" fill="#00B4D8" font-size="16" font-weight="bold">$</text>
  
  <!-- Analytics Points -->
  <circle cx="80" cy="100" r="4" fill="white"/>
  <circle cx="120" cy="80" r="4" fill="white"/>
  <circle cx="160" cy="65" r="4" fill="white"/>
  <circle cx="200" cy="50" r="4" fill="white"/>
  
  <!-- Connecting Line -->
  <path d="M80 100 L120 80 L160 65 L200 50" stroke="white" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
</svg>