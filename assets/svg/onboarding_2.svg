<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone/Tablet Device -->
  <rect x="80" y="50" width="140" height="200" rx="15" fill="white" fill-opacity="0.9"/>
  <rect x="90" y="60" width="120" height="180" rx="10" fill="#1E293B"/>
  
  <!-- Order Items in Device -->
  <rect x="100" y="80" width="100" height="25" rx="5" fill="white" fill-opacity="0.8"/>
  <rect x="100" y="115" width="100" height="25" rx="5" fill="white" fill-opacity="0.6"/>
  <rect x="100" y="150" width="100" height="25" rx="5" fill="white" fill-opacity="0.8"/>
  <rect x="100" y="185" width="100" height="25" rx="5" fill="white" fill-opacity="0.4"/>
  
  <!-- Status Indicators -->
  <circle cx="105" cy="87" r="5" fill="#00B4D8"/>
  <circle cx="105" cy="122" r="5" fill="#00B4D8"/>
  <circle cx="105" cy="157" r="5" fill="#00B4D8"/>
  <circle cx="105" cy="192" r="5" fill="#00B4D8"/>
  
  <!-- Truck/Delivery Icon -->
  <rect x="50" y="200" width="60" height="40" rx="5" fill="white" fill-opacity="0.9"/>
  <circle cx="65" cy="245" r="8" fill="white"/>
  <circle cx="95" cy="245" r="8" fill="white"/>
  <rect x="55" y="195" width="50" height="10" fill="white" fill-opacity="0.7"/>
  
  <!-- Package -->
  <rect x="190" y="180" width="50" height="50" rx="5" fill="white" fill-opacity="0.9"/>
  <line x1="190" y1="205" x2="240" y2="205" stroke="#1E293B" stroke-width="2"/>
  <line x1="215" y1="180" x2="215" y2="230" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Delivery Route Line -->
  <path d="M110 240 Q150 220 190 200" stroke="white" stroke-width="3" stroke-dasharray="5,5" fill="none"/>
</svg>